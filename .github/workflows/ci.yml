name: Python CI

on:
  push:
    branches:
      - main
  pull_request:
    branches: [ main ]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-check:
    name: Check Python syntax
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Validate Python syntax
        run: python -m compileall -q app.py tests

  unit-tests:
    name: Run tests and upload report
    needs: quality-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Run tests and save report
        run: python -m unittest discover -s tests -v 2>&1 | tee test-results.txt

      - name: Upload test report
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: test-results.txt
          retention-days: 5

  report:
    name: Download and inspect report
    needs: unit-tests
    runs-on: ubuntu-latest

    steps:
      - name: Download test report
        uses: actions/download-artifact@v8
        with:
          name: unit-test-report
          path: artifacts

      - name: Display test report
        run: cat artifacts/test-results.txt