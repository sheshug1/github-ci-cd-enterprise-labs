
name: Python CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  quality-check:
    name: Check Python syntax
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Validate Python syntax
        run: python -m compileall -q app.py tests

  unit-tests:
    name: Test Python ${{ matrix.python-version }}
    needs: quality-check
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 3

      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests and save report
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee test-results-${{ matrix.python-version }}.txt

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report-${{ matrix.python-version }}
          path: test-results-${{ matrix.python-version }}.txt
          if-no-files-found: ignore
          retention-days: 5

  build-metadata:
    name: Generate build metadata
    runs-on: ubuntu-latest

    outputs:
      app_version: ${{ steps.metadata.outputs.app_version }}
      deploy_target: ${{ steps.metadata.outputs.deploy_target }}

    steps:
      - name: Generate metadata
        id: metadata
        shell: bash
        run: |
          echo "app_version=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            echo "deploy_target=production" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_target=testing" >> "$GITHUB_OUTPUT"
          fi

  report:
    name: Download and inspect reports
    needs:
      - unit-tests
      - build-metadata
    runs-on: ubuntu-latest

    steps:
      - name: Download all Python test reports
        uses: actions/download-artifact@v8
        with:
          pattern: unit-test-report-*
          path: artifacts
          merge-multiple: true

      - name: Display all test reports
        run: |
          for file in artifacts/test-results-*.txt; do
            echo "----- $file -----"
            cat "$file"
          done

      - name: Display build metadata
        env:
          APP_VERSION: ${{ needs.build-metadata.outputs.app_version }}
          DEPLOY_TARGET: ${{ needs.build-metadata.outputs.deploy_target }}
        run: |
          echo "Application version: $APP_VERSION"
          echo "Deployment target: $DEPLOY_TARGET"
