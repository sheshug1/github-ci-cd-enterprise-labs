
name: Python CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  quality-check:
    name: Check Python syntax
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Validate Python syntax
        run: python -m compileall -q app.py tests

  unit-tests:
    name: Test ${{ matrix.os }} / Python ${{ matrix.python-version }}
    needs: quality-check

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      max-parallel: 3

      matrix:
        os:
          - ubuntu-latest
          - windows-latest

        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

        exclude:
          - os: windows-latest
            python-version: "3.11"

        include:
          - test_profile: standard

          - os: windows-latest
            python-version: "3.13"
            test_profile: extended

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Display matrix configuration
        env:
          MATRIX_OS: ${{ matrix.os }}
          PYTHON_VERSION: ${{ matrix.python-version }}
          TEST_PROFILE: ${{ matrix.test_profile }}
        run: |
          python -c "import os; print('OS:', os.environ['MATRIX_OS']); print('Python:', os.environ['PYTHON_VERSION']); print('Profile:', os.environ['TEST_PROFILE'])"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v > test-results-${{ matrix.os }}-py${{ matrix.python-version }}.txt 2>&1

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-${{ matrix.os }}-py${{ matrix.python-version }}
          path: test-results-${{ matrix.os }}-py${{ matrix.python-version }}.txt
          if-no-files-found: ignore
          retention-days: 5

  build-metadata:
    name: Generate build metadata
    runs-on: ubuntu-latest

    outputs:
      app_version: ${{ steps.metadata.outputs.app_version }}
      deploy_target: ${{ steps.metadata.outputs.deploy_target }}

    steps:
      - name: Generate metadata
        id: metadata
        shell: bash
        run: |
          echo "app_version=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            echo "deploy_target=production" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_target=testing" >> "$GITHUB_OUTPUT"
          fi

  report:
    name: Download and inspect reports
    needs:
      - unit-tests
      - build-metadata

    runs-on: ubuntu-latest

    steps:
      - name: Download all test reports
        uses: actions/download-artifact@v8
        with:
          pattern: test-report-*
          path: artifacts
          merge-multiple: true

      - name: Display test reports
        run: |
          for file in artifacts/test-results-*.txt; do
            echo "----- $file -----"
            cat "$file"
          done

      - name: Display build metadata
        env:
          APP_VERSION: ${{ needs.build-metadata.outputs.app_version }}
          DEPLOY_TARGET: ${{ needs.build-metadata.outputs.deploy_target }}
        run: |
          echo "Application version: $APP_VERSION"
          echo "Deployment target: $DEPLOY_TARGET"
